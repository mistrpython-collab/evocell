<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <title>EvoCell - Survival Game</title>
    <link rel="stylesheet" href="style.css">
    
    <!-- ✅ Favicon statis (PNG transparan, cadangan sebelum animasi jalan) -->
    <link rel="icon" type="image/png" href="assets/images/main-menu-evocell/virushighres.png">
    
    <!-- Load Phaser -->
    <script src="https://cdn.jsdelivr.net/npm/phaser@3.70.0/dist/phaser.min.js"></script>
</head>
<body>
    <!-- Loading Screen -->
    <div id="loading-screen">
        <div class="loading-content">
            <h1>EvoCell</h1>
            <p>Memuat game...</p>
        </div>
    </div>

    <!-- Game Container -->
    <div id="game-container"></div>

    <!-- Error Message -->
    <div id="error-message" style="display: none;">
        <p>❌ Gagal memuat game. Periksa koneksi internet atau nonaktifkan ad blocker.</p>
        <button onclick="location.reload()" style="margin-top:15px;padding:10px 20px;background:#00ff00;color:#000;border:none;cursor:pointer;border-radius:5px;">Refresh</button>
    </div>

    <!-- OVERLAY PANDUAN -->
    <div id="guideOverlay" class="guide-overlay">
        <div class="guide-container">
            <button class="close-guide-btn" onclick="closeGuide()">x</button>
            <iframe id="guidePdfViewer" src="" class="pdf-viewer" title="Panduan"></iframe>
            <div class="pdf-fallback">
                <p>Jika PDF tidak muncul, <a id="guidePdfLink" href="#" target="_blank">Klik di sini untuk membuka PDF</a>.</p>
            </div>
        </div>
    </div>

    <!-- Script untuk Buka/Tutup Overlay -->
    <script>
        function openGuide() {
            const overlay = document.getElementById('guideOverlay');
            const viewer = document.getElementById('guidePdfViewer');
            const link = document.getElementById('guidePdfLink');
            
            viewer.src = 'assets/guides/howtoplay.pdf';
            link.href = 'assets/guides/howtoplay.pdf';
            overlay.style.display = 'flex';
        }
        
        function closeGuide() {
            const overlay = document.getElementById('guideOverlay');
            const viewer = document.getElementById('guidePdfViewer');
            overlay.style.display = 'none';
            viewer.src = '';
        }
        
        document.getElementById('guideOverlay').addEventListener('click', function(e) {
            if (e.target === this) {
                closeGuide();
            }
        });
    </script>

        <!-- ✅ SCRIPT FAVICON ANIMASI (versi ZOOM - virus lebih besar) -->
    <script>
        (function () {
            const FRAME_INTERVAL = 500; // kecepatan ganti frame (ms)
            const ZOOM = 1.3;           // ✅ PENGATUR BESAR: 1.2 = sedikit besar, 1.6 = besar banget
            const SIZE = 128;           // resolusi canvas (lebih tajam)
            const sprite = new Image();
            sprite.src = 'assets/images/main-menu-evocell/virushighres.png';

            sprite.onload = function () {
                const totalFrame = 2;
                const fw = sprite.width / totalFrame;
                const fh = sprite.height;

                const canvas = document.createElement('canvas');
                canvas.width = SIZE;
                canvas.height = SIZE;
                const ctx = canvas.getContext('2d');

                let link = document.querySelector("link[rel='icon']");
                if (!link) {
                    link = document.createElement('link');
                    link.rel = 'icon';
                    document.head.appendChild(link);
                }

                let i = 0;
                setInterval(function () {
                    // ✅ CROP bagian tengah frame supaya virus terlihat lebih besar
                    const sw = fw / ZOOM;
                    const sh = fh / ZOOM;
                    const sx = i * fw + (fw - sw) / 2;
                    const sy = (fh - sh) / 2;

                    ctx.clearRect(0, 0, SIZE, SIZE);
                    ctx.drawImage(sprite, sx, sy, sw, sh, 0, 0, SIZE, SIZE);
                    link.href = canvas.toDataURL('image/png');
                    i = (i + 1) % totalFrame;
                }, FRAME_INTERVAL);
            };

            sprite.onerror = function () {
                console.warn('⚠️ Favicon sprite tidak ditemukan:', sprite.src);
            };
        })();
    </script>

    <!-- Load Game -->
    <script src="js/main.js" type="module"></script>
</body>
</html>
