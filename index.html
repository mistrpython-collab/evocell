<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    
    <!-- iOS Fullscreen Support -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="mobile-web-app-capable" content="yes">
    
    <title>EvoCell - Survival Game</title>
    <link rel="stylesheet" href="style.css">
    
    <!-- Loading Indicator -->
    <style>
        #loading-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #000000;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 999999;
            color: #00ff00;
            font-family: Arial, sans-serif;
        }
        #loading-screen h1 {
            font-size: 32px;
            margin-bottom: 20px;
            text-shadow: 0 0 10px #00ff00;
        }
        #loading-screen p {
            font-size: 16px;
            color: #cccccc;
        }
        #error-message {
            display: none;
            color: #ff4444;
            text-shadow: 0 0 10px #ff0000;
            text-align: center;
            padding: 20px;
        }
    </style>
</head>
<body>
    <!-- Loading Screen -->
    <div id="loading-screen">
        <h1>Loading EvoCell...</h1>
        <p>Please wait while the game loads</p>
        <div id="error-message"></div>
    </div>

    <div id="game-container"></div>
    
    <!-- Load Phaser dengan fallback -->
    <script>
        // Fallback jika CDN gagal
        window.phaserLoaded = false;
        
        function loadScript(src) {
            return new Promise((resolve, reject) => {
                const script = document.createElement('script');
                script.src = src;
                script.type = 'text/javascript';
                script.onload = () => {
                    window.phaserLoaded = true;
                    resolve();
                };
                script.onerror = () => {
                    reject(new Error(`Failed to load: ${src}`));
                };
                document.head.appendChild(script);
            });
        }

        // Load Phaser dari CDN
        loadScript('https://cdn.jsdelivr.net/npm/phaser@3.70.0/dist/phaser.min.js')
            .catch(() => {
                // Fallback jika CDN utama gagal
                console.warn('Primary CDN failed, trying fallback...');
                return loadScript('https://cdnjs.cloudflare.com/ajax/libs/phaser/3.70.0/phaser.min.js');
            })
            .catch(() => {
                // Error handling
                document.getElementById('error-message').style.display = 'block';
                document.getElementById('error-message').innerHTML = 
                    '<strong>Failed to load game!</strong><br>' +
                    'Please disable ad blocker and refresh.<br>' +
                    '<button onclick="location.reload()" style="margin-top:10px;padding:10px;background:#00ff00;color:#000;border:none;cursor:pointer;">Refresh</button>';
            })
            .finally(() => {
                // Load game main.js setelah Phaser ready
                if (window.phaserLoaded) {
                    const mainScript = document.createElement('script');
                    mainScript.type = 'module';
                    mainScript.src = 'js/main.js';
                    document.body.appendChild(mainScript);
                    
                    // Hide loading screen setelah game load
                    setTimeout(() => {
                        const loadingScreen = document.getElementById('loading-screen');
                        if (loadingScreen) {
                            loadingScreen.style.display = 'none';
                        }
                    }, 2000);
                }
            });
    </script>
</body>
</html>
